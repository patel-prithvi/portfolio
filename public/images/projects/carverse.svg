<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Consolas, monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1f27"/>
      <stop offset="100%" stop-color="#11141a"/>
    </linearGradient>
    <linearGradient id="termGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161a22"/>
      <stop offset="100%" stop-color="#0d0f14"/>
    </linearGradient>
  </defs>

  <!-- page bg -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <!-- subtle car-road accent stripe -->
  <rect x="0" y="770" width="1200" height="30" fill="#0a0c10"/>
  <g stroke="#3a3f4a" stroke-width="4" stroke-dasharray="24 20">
    <line x1="0" y1="785" x2="1200" y2="785"/>
  </g>

  <!-- Title -->
  <text x="60" y="66" font-size="34" font-weight="bold" fill="#ffffff">🚗 CarVerse</text>
  <text x="270" y="66" font-size="20" fill="#7a8494">— Car Rental System</text>
  <text x="60" y="94" font-size="15" fill="#5f6875">Java 17 · MySQL · JDBC · Console-Based OOP Project</text>

  <!-- Terminal window -->
  <rect x="60" y="126" width="1080" height="560" rx="12" fill="url(#termGrad)" stroke="#2a2f3a" stroke-width="1.5"/>

  <!-- Terminal titlebar -->
  <rect x="60" y="126" width="1080" height="42" rx="12" fill="#20242e"/>
  <rect x="60" y="152" width="1080" height="16" fill="#20242e"/>
  <circle cx="90" cy="147" r="7" fill="#ff5f57"/>
  <circle cx="114" cy="147" r="7" fill="#febc2e"/>
  <circle cx="138" cy="147" r="7" fill="#28c840"/>
  <text x="600" y="152" font-size="14" fill="#8a93a3" text-anchor="middle">carverse@terminal:~$ java CarVerse</text>

  <!-- Terminal body text -->
  <g font-size="16" fill="#c9d1d9">
    <text x="90" y="205" fill="#58d68d">=====================================</text>
    <text x="90" y="230" fill="#f4c430">        🔑  CarVerse - Customer Login</text>
    <text x="90" y="255" fill="#58d68d">=====================================</text>
    <text x="90" y="285" fill="#e6e6e6">1️⃣  Login using Email &amp; Password</text>
    <text x="90" y="310" fill="#e6e6e6">2️⃣  Login using Phone &amp; Password</text>
    <text x="90" y="335" fill="#e6e6e6">3️⃣  Go Back</text>
    <text x="90" y="365" fill="#6fa8dc">&gt; Enter choice: 1_</text>

    <text x="90" y="410" fill="#58d68d">-------------------------------------</text>
    <text x="90" y="435" fill="#f4c430">          🚘  Book a Car</text>
    <text x="90" y="460" fill="#e6e6e6">Car ID          : 5   (Swift · Maruti · Sedan)</text>
    <text x="90" y="485" fill="#e6e6e6">Start → End     : Ahmedabad → Surat</text>
    <text x="90" y="510" fill="#e6e6e6">Duration        : 5.0 hrs</text>
    <text x="90" y="535" fill="#7fdc7f">✅ Car booked successfully! Total cost: ₹2500</text>

    <text x="90" y="580" fill="#58d68d">=====================================</text>
    <text x="90" y="605" fill="#f4c430">          🧾  RENTAL BILL</text>
    <text x="90" y="630" fill="#e6e6e6">Base ₹2500.00  +  Late Fee ₹500.00</text>
    <text x="90" y="655" fill="#ffffff" font-weight="bold">Total Paid      : ₹3000.00   (Card)</text>
    <text x="90" y="680" fill="#58d68d">=====================================</text>
  </g>

  <!-- blinking cursor block -->
  <rect x="270" y="352" width="11" height="18" fill="#6fa8dc"/>

  <!-- Tech badges -->
  <g font-size="14" font-weight="bold" fill="#0d0f14">
    <rect x="60" y="710" width="80" height="30" rx="6" fill="#f89820"/>
    <text x="100" y="730" text-anchor="middle">JAVA 17</text>

    <rect x="152" y="710" width="90" height="30" rx="6" fill="#4479a1"/>
    <text x="197" y="730" text-anchor="middle" fill="#ffffff">MYSQL</text>

    <rect x="254" y="710" width="80" height="30" rx="6" fill="#5382a1"/>
    <text x="294" y="730" text-anchor="middle" fill="#ffffff">JDBC</text>

    <rect x="346" y="710" width="150" height="30" rx="6" fill="#b02a37"/>
    <text x="421" y="730" text-anchor="middle" fill="#ffffff">JAKARTA MAIL</text>

    <rect x="508" y="710" width="120" height="30" rx="6" fill="#3a3f4a"/>
    <text x="568" y="730" text-anchor="middle" fill="#e6e6e6">OOP DESIGN</text>
  </g>

  <text x="1140" y="732" font-size="14" fill="#5f6875" text-anchor="end">github.com/patel-prithvi/CarRentalSystem_CarVerse</text>
</svg>