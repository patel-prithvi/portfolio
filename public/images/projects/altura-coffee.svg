<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b1c14"/>
      <stop offset="100%" stop-color="#1a110b"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6ede1"/>
      <stop offset="100%" stop-color="#efe1cf"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6f4527"/>
      <stop offset="100%" stop-color="#4a2c17"/>
    </linearGradient>
    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a30"/>
      <stop offset="100%" stop-color="#5c3a1e"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Browser frame -->
  <rect x="0" y="0" width="1200" height="800" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="56" rx="18" fill="#241811"/>
  <rect x="0" y="28" width="1200" height="28" fill="#241811"/>
  <circle cx="30" cy="28" r="7" fill="#e0574c"/>
  <circle cx="54" cy="28" r="7" fill="#e0b23f"/>
  <circle cx="78" cy="28" r="7" fill="#5cb26b"/>
  <rect x="420" y="14" width="360" height="28" rx="14" fill="#3a2a1e"/>
  <text x="600" y="33" font-family="monospace" font-size="13" fill="#c9b199" text-anchor="middle">altura-coffee.vercel.app</text>

  <!-- Page content area -->
  <rect x="0" y="56" width="1200" height="744" fill="url(#cream)"/>

  <!-- Site navbar -->
  <text x="60" y="120" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#3a2412" letter-spacing="2">ALTURA</text>
  <g font-family="Arial, sans-serif" font-size="15" fill="#5c4630">
    <text x="850" y="116">Home</text>
    <text x="920" y="116">Coffee</text>
    <text x="995" y="116">About</text>
    <text x="1065" y="116">Contact</text>
  </g>

  <!-- Hero -->
  <text x="60" y="240" font-family="Georgia, serif" font-size="58" font-weight="bold" fill="#2c1a0e">Crafted</text>
  <text x="60" y="305" font-family="Georgia, serif" font-size="58" font-weight="bold" fill="#a9682f">Higher.</text>
  <text x="62" y="350" font-family="Arial, sans-serif" font-size="17" fill="#6b5744">Every cup tells a story — handcrafted specialty</text>
  <text x="62" y="374" font-family="Arial, sans-serif" font-size="17" fill="#6b5744">coffee, premium beans, inspired by Ahmedabad.</text>

  <!-- CTA buttons -->
  <rect x="62" y="400" width="160" height="48" rx="24" fill="#3a2412" filter="url(#softShadow)"/>
  <text x="142" y="429" font-family="Arial, sans-serif" font-size="15" fill="#f6ede1" text-anchor="middle">Order Coffee</text>
  <rect x="238" y="400" width="180" height="48" rx="24" fill="none" stroke="#3a2412" stroke-width="2"/>
  <text x="328" y="429" font-family="Arial, sans-serif" font-size="15" fill="#3a2412" text-anchor="middle">Explore Recipes</text>

  <!-- Stats -->
  <g font-family="Georgia, serif" font-weight="bold" fill="#3a2412" font-size="26">
    <text x="62" y="500">30+</text>
    <text x="170" y="500">12k+</text>
    <text x="290" y="500">4.9★</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#8a7660">
    <text x="62" y="520">Coffee Recipes</text>
    <text x="170" y="520">Happy Customers</text>
    <text x="290" y="520">Average Rating</text>
  </g>

  <!-- Coffee cup illustration (right side) -->
  <g filter="url(#softShadow)">
    <path d="M 870 220 Q 870 200 895 200 L 1015 200 Q 1040 200 1040 220 L 1030 400 Q 1027 430 995 430 L 915 430 Q 883 430 880 400 Z" fill="url(#cup)"/>
    <ellipse cx="955" cy="220" rx="85" ry="16" fill="url(#coffee)"/>
    <ellipse cx="955" cy="216" rx="70" ry="10" fill="#3f2712" opacity="0.4"/>
    <path d="M 1040 240 Q 1085 240 1085 280 Q 1085 320 1040 320" fill="none" stroke="url(#cup)" stroke-width="16" stroke-linecap="round"/>
  </g>
  <!-- steam -->
  <path d="M 930 190 Q 920 160 935 140 Q 945 125 935 105" fill="none" stroke="#c9b199" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M 970 190 Q 960 160 975 140 Q 985 125 975 105" fill="none" stroke="#c9b199" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Menu section label -->
  <text x="60" y="600" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#a9682f" letter-spacing="2">OUR MENU</text>
  <text x="60" y="630" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2c1a0e">Best Selling Coffees</text>

  <!-- Product cards -->
  <g filter="url(#softShadow)">
    <rect x="60" y="660" width="330" height="110" rx="14" fill="#ffffff"/>
    <rect x="440" y="660" width="330" height="110" rx="14" fill="#ffffff"/>
    <rect x="820" y="660" width="330" height="110" rx="14" fill="#ffffff"/>
  </g>

  <circle cx="120" cy="715" r="34" fill="url(#coffee)"/>
  <circle cx="500" cy="715" r="34" fill="url(#coffee)"/>
  <circle cx="880" cy="715" r="34" fill="url(#coffee)"/>

  <g font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#2c1a0e">
    <text x="168" y="700">ALTURA Espresso</text>
    <text x="548" y="700">Classic Latte</text>
    <text x="928" y="700">Cappuccino</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#8a7660">
    <text x="168" y="722">Bold &amp; rich, dark chocolate notes</text>
    <text x="548" y="722">Velvety steamed milk blend</text>
    <text x="928" y="722">Smooth foam, latte art</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#a9682f">
    <text x="168" y="748">₹170</text>
    <text x="548" y="748">₹240</text>
    <text x="928" y="748">₹220</text>
  </g>
</svg>