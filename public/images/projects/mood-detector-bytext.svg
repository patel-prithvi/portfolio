<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fef3e2"/>
    </linearGradient>
    <linearGradient id="joyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#pageBg)"/>

  <!-- Title -->
  <text x="60" y="56" font-size="30" font-weight="bold" fill="#22223b">🎭 Mood Detector by Text AI</text>
  <text x="60" y="82" font-size="14" fill="#8a8496">Python · Streamlit · Hugging Face Transformers · PyTorch · Pandas · Altair</text>

  <!-- Browser window -->
  <rect x="60" y="108" width="1080" height="610" rx="12" fill="#ffffff" stroke="#e6ddd0" stroke-width="1.5"/>
  <rect x="60" y="108" width="1080" height="40" rx="12" fill="#f4ede1"/>
  <rect x="60" y="132" width="1080" height="16" fill="#f4ede1"/>
  <circle cx="88" cy="128" r="6" fill="#ff5f57"/>
  <circle cx="108" cy="128" r="6" fill="#febc2e"/>
  <circle cx="128" cy="128" r="6" fill="#28c840"/>
  <rect x="430" y="118" width="340" height="20" rx="10" fill="#ffffff" stroke="#e6ddd0" stroke-width="1"/>
  <text x="600" y="132" font-size="12" fill="#8a8496" text-anchor="middle">localhost:8501</text>

  <!-- App heading -->
  <text x="100" y="188" font-size="24" font-weight="bold" fill="#22223b">🎭 Mood Detector</text>
  <text x="100" y="212" font-size="13" fill="#8a8496">Enter a sentence or paragraph — AI detects the emotion behind it.</text>

  <!-- Text input box -->
  <rect x="100" y="234" width="1000" height="80" rx="8" fill="#faf6ef" stroke="#e6ddd0" stroke-width="1.5"/>
  <text x="116" y="262" font-size="14" fill="#22223b">I just got a new job and I'm super excited!</text>
  <text x="116" y="286" font-size="12" fill="#c9c2b4">|</text>

  <rect x="100" y="328" width="150" height="38" rx="8" fill="url(#joyGrad)"/>
  <text x="175" y="352" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Detect Mood</text>

  <!-- Result card -->
  <rect x="100" y="392" width="480" height="150" rx="12" fill="#fff4de" stroke="#ffd580" stroke-width="1.5"/>
  <text x="130" y="440" font-size="52">😄</text>
  <text x="210" y="430" font-size="13" fill="#8a8496">Mood Detected</text>
  <text x="210" y="460" font-size="26" font-weight="bold" fill="#c2410c">Joy</text>
  <rect x="210" y="472" width="220" height="14" rx="7" fill="#ffe3b3"/>
  <rect x="210" y="472" width="209" height="14" rx="7" fill="url(#joyGrad)"/>
  <text x="440" y="483" font-size="12" fill="#c2410c" font-weight="bold">95%</text>
  <text x="130" y="522" font-size="12" fill="#8a8496">Confidence: 0.95   ·   Model: distilbert-emotion</text>

  <!-- Emotion probability bar chart -->
  <text x="620" y="410" font-size="14" font-weight="bold" fill="#22223b">All Emotion Probabilities</text>
  <g font-size="11" fill="#8a8496">
    <!-- axis -->
    <line x1="700" y1="430" x2="700" y2="620" stroke="#e6ddd0" stroke-width="1.5"/>
    <line x1="700" y1="620" x2="1060" y2="620" stroke="#e6ddd0" stroke-width="1.5"/>

    <!-- bars: label, value(0-1), color -->
    <!-- joy -->
    <text x="695" y="443" text-anchor="end">joy</text>
    <rect x="700" y="433" width="342" height="16" fill="url(#joyGrad)"/>
    <text x="1048" y="445" fill="#22223b">0.95</text>

    <!-- love -->
    <text x="695" y="467" text-anchor="end">love</text>
    <rect x="700" y="457" width="72" height="16" fill="#ef476f"/>
    <text x="778" y="469" fill="#22223b">0.20</text>

    <!-- surprise -->
    <text x="695" y="491" text-anchor="end">surprise</text>
    <rect x="700" y="481" width="54" height="16" fill="#ffd166"/>
    <text x="760" y="493" fill="#22223b">0.15</text>

    <!-- neutral -->
    <text x="695" y="515" text-anchor="end">neutral</text>
    <rect x="700" y="505" width="43" height="16" fill="#9a9aa5"/>
    <text x="749" y="517" fill="#22223b">0.12</text>

    <!-- sadness -->
    <text x="695" y="539" text-anchor="end">sadness</text>
    <rect x="700" y="529" width="25" height="16" fill="#5b7fbf"/>
    <text x="731" y="541" fill="#22223b">0.07</text>

    <!-- fear -->
    <text x="695" y="563" text-anchor="end">fear</text>
    <rect x="700" y="553" width="18" height="16" fill="#6a4c93"/>
    <text x="724" y="565" fill="#22223b">0.05</text>

    <!-- anger -->
    <text x="695" y="587" text-anchor="end">anger</text>
    <rect x="700" y="577" width="14" height="16" fill="#d62828"/>
    <text x="720" y="589" fill="#22223b">0.04</text>

    <!-- disgust -->
    <text x="695" y="611" text-anchor="end">disgust</text>
    <rect x="700" y="601" width="8" height="16" fill="#6a994e"/>
    <text x="714" y="613" fill="#22223b">0.02</text>
  </g>

  <!-- example I/O footer -->
  <rect x="100" y="565" width="480" height="90" rx="10" fill="#faf6ef" stroke="#e6ddd0" stroke-width="1"/>
  <text x="118" y="588" font-size="12" font-weight="bold" fill="#8a8496">EXAMPLE OUTPUT</text>
  <text x="118" y="610" font-size="12" fill="#22223b" font-family="'Courier New', monospace">Mood Detected: Joy 😄 (Confidence: 0.95)</text>
  <text x="118" y="632" font-size="11" fill="#8a8496">+ bar chart of all emotion probabilities</text>

  <text x="1140" y="740" font-size="13" fill="#8a8496" text-anchor="end">github.com/patel-prithvi/mood-detector</text>
</svg>